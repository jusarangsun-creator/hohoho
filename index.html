<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>콩 미로 탐험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: big square-tile maze on the left (electronic whiteboard); scoreboard + D-pad on the right; stacks on narrow screens. */
:root{
  --bg:#EAF3DF; --ink:#1F3320; --muted:#566F53;
  --path:#FBF8E8; --wall:#2F5D3A; --wall-hi:#3E7549;
  --accent:#F2B628; --accent-ink:#3A2A00; --gate-edge:#B9810A; --goal-bg:#FFE9A8;
  --good:#2E8B4F; --bad:#C8473B; --panel:#FFFFFF; --line:#C5D9B4; --veil:rgba(20,40,25,.55);
  --f-display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Noto Sans KR',system-ui,sans-serif;
  --W:17; --H:13;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13201A; --ink:#EAF3DF; --muted:#9DB79A;
    --path:#24382C; --wall:#0A130E; --wall-hi:#16271C;
    --accent:#F2B628; --accent-ink:#2A1E00; --gate-edge:#FFD36B; --goal-bg:#3D3718;
    --good:#5FCB84; --bad:#F0796C; --panel:#1B2C22; --line:#2E4637; --veil:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13201A; --ink:#EAF3DF; --muted:#9DB79A;
  --path:#24382C; --wall:#0A130E; --wall-hi:#16271C;
  --accent:#F2B628; --accent-ink:#2A1E00; --gate-edge:#FFD36B; --goal-bg:#3D3718;
  --good:#5FCB84; --bad:#F0796C; --panel:#1B2C22; --line:#2E4637; --veil:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1240px;margin:0 auto;display:grid;gap:12px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,3.2vw,2.6rem);line-height:1.1;margin:0;text-wrap:balance}
.sub{flex-basis:100%;margin:0;color:var(--muted);font-size:clamp(.95rem,1.5vw,1.1rem)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 16px;font-weight:700;font-size:clamp(.95rem,1.6vw,1.15rem);white-space:nowrap}
.pill b{font-family:var(--f-display);font-weight:400;font-size:1.3em;font-variant-numeric:tabular-nums}
.pill.team{background:var(--accent);border-color:var(--gate-edge);color:var(--accent-ink);font-family:var(--f-display);font-weight:400;font-size:clamp(1.2rem,2.2vw,1.7rem)}
.pill.timer{background:var(--ink);border-color:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,3vw,2.4rem);line-height:1.2;font-variant-numeric:tabular-nums;min-width:8ch;text-align:center}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.mazewrap{
  position:relative; container-type:inline-size; justify-self:center;
  width:min(100%, calc((100svh - 190px) * var(--W) / var(--H)));
  min-width:min(100%, 300px);
  border:4px solid var(--wall); border-radius:16px; background:var(--wall);
}
.maze{
  display:grid; grid-template-columns:repeat(var(--W),1fr); aspect-ratio:var(--W)/var(--H);
  border-radius:12px; overflow:hidden;
  touch-action:manipulation; cursor:pointer; user-select:none; -webkit-user-select:none;
}
.t{display:grid;place-items:center;font-size:calc(100cqw / var(--W) * .62);line-height:1}
.w{background:var(--wall);box-shadow:inset 0 -3px 0 var(--wall-hi)}
.p{background:var(--path)}
.door{box-shadow:inset 0 0 0 2px var(--line)}
.gate{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 3px var(--gate-edge);font-family:var(--f-display);animation:knock 1.8s ease-in-out infinite}
.gate b{font-weight:400;font-size:1.1em}
.goal{background:var(--goal-bg)}
@keyframes knock{0%,100%{filter:none}50%{filter:brightness(1.12)}}

.player{
  position:absolute; left:0; top:0; z-index:3; pointer-events:none;
  width:calc(100% / var(--W)); height:calc(100% / var(--H));
  display:grid; place-items:center;
  transition:left .085s linear, top .085s linear;
}
.bean{
  width:78%; height:88%; position:relative; background:var(--accent);
  border-radius:50% 50% 46% 46% / 56% 56% 44% 44%;
  box-shadow:inset -.25em -.2em 0 rgba(0,0,0,.14), 0 .12em 0 rgba(0,0,0,.25);
  animation:bob .7s ease-in-out infinite;
}
.bean::before,.bean::after{content:"";position:absolute;top:34%;width:16%;height:20%;background:#2A1E00;border-radius:50%}
.bean::before{left:26%} .bean::after{right:26%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.shake{animation:shake .3s}
@keyframes shake{20%{transform:translateX(-6%)}60%{transform:translateX(6%)}}

.toast{
  position:absolute; left:50%; top:10px; transform:translate(-50%,-8px); z-index:5; opacity:0; pointer-events:none;
  background:var(--ink); color:var(--bg); font-family:var(--f-display); font-size:clamp(1.1rem,2.4cqw,1.7rem);
  padding:6px 20px; border-radius:999px; transition:opacity .2s, transform .2s; max-width:92%; text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.trail{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.trail polyline{fill:none;stroke:#E2762B;stroke-width:.3;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.wb{margin:0;padding:10px 18px;border-radius:16px;background:var(--bad);color:var(--bg);font-family:var(--f-display);font-size:clamp(1.3rem,2.8vw,2rem);line-height:1.3;text-align:center;text-wrap:balance}
.wb.boing{animation:boing .6s ease-out}
@keyframes boing{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.18);opacity:1}55%{transform:scale(.92)}75%{transform:scale(1.05)}100%{transform:scale(1)}}
.count{
  position:absolute; inset:0; z-index:6; display:grid; place-items:center; pointer-events:none; border-radius:12px;
  background:rgba(0,0,0,.28); color:#fff; font-family:var(--f-display); font-size:clamp(5rem,26cqw,15rem); line-height:1;
  text-shadow:0 .04em 0 rgba(0,0,0,.4);
}
.count.pop span{animation:pop .5s ease-out}

.side{display:grid;gap:14px}
.board{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.board h3{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.board ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;border-radius:12px;border:2px solid transparent;font-weight:700}
.board li small{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap}
.board li.now{background:var(--goal-bg);border-color:var(--accent)}
.board li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad{display:grid;gap:8px;justify-items:center}
.padcap{margin:0;font-family:var(--f-display);font-size:1.3rem}
.how{margin:0;padding:12px 16px;border-radius:14px;background:var(--goal-bg);font-weight:700;font-size:clamp(1rem,1.8vw,1.25rem)}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,230px)}
.dpad button{
  aspect-ratio:1; min-height:64px; border-radius:16px; border:2px solid var(--line); background:var(--panel);
  font-size:1.7rem; box-shadow:0 4px 0 var(--line); touch-action:manipulation;
}
.dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.dpad .up{grid-column:2;grid-row:1} .dpad .lf{grid-column:1;grid-row:2} .dpad .dn{grid-column:2;grid-row:2} .dpad .rt{grid-column:3;grid-row:2}
.ghost{background:transparent;border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;color:var(--muted)}
.ghost.armed{border-color:var(--bad);color:var(--bad)}

.modal{position:fixed;inset:0;z-index:20;background:var(--veil);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.card{background:var(--panel);border:3px solid var(--accent);border-radius:24px;width:min(100%,980px);padding:clamp(18px,3.2vw,36px);display:grid;gap:16px}
.tag{margin:0;font-weight:700;color:var(--muted);font-size:clamp(.95rem,1.6vw,1.15rem)}
.card h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,3.6vw,2.6rem);line-height:1.25;margin:0;text-wrap:balance}
.opts{display:grid;gap:12px}
.opt{
  min-height:68px; text-align:left; padding:12px 20px; border-radius:16px; background:var(--bg);
  border:3px solid var(--line); font-weight:700; font-size:clamp(1.2rem,2.6vw,1.8rem);
}
.opt:hover{border-color:var(--accent)}
.opt.good{background:var(--good);border-color:var(--good);color:#fff}
.opt.bad{background:transparent;border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{margin:0;min-height:1.6em;font-weight:700;font-size:clamp(1.05rem,2vw,1.35rem)}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 28px;font-family:var(--f-display);font-size:1.6rem;box-shadow:0 4px 0 var(--gate-edge)}
.learn{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:clamp(1.05rem,2vw,1.35rem);font-weight:700}
.sec{margin:0;font-weight:700;color:var(--muted);font-size:clamp(.95rem,1.6vw,1.15rem)}
.pick{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 22px;border-radius:14px;border:3px solid var(--line);background:var(--bg);font-weight:700;font-size:clamp(1.1rem,2.2vw,1.5rem)}
.chip:hover{border-color:var(--accent)}
.chip.done{color:var(--muted)}
.cnt{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cnt .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--gate-edge)}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:52vh;overflow-y:auto}
.qlist li{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;gap:4px;font-size:clamp(.95rem,1.6vw,1.1rem)}
.qlist .qq{font-weight:900}
.qlist .oo{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-weight:700}
.qlist .oo b{color:var(--good)}
.qlist .qt{font-weight:700;color:var(--muted);font-size:.9em}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.names label{display:grid;gap:4px;font-weight:700;color:var(--muted);font-size:.95rem}
.names input{font-weight:700;font-size:1.25rem;padding:10px 12px;border-radius:12px;border:3px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.big{font-family:var(--f-display);font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.1;margin:0}
.res{display:flex;flex-wrap:wrap;gap:12px 28px;font-weight:700;font-size:clamp(1.1rem,2.2vw,1.5rem)}
.res b{font-family:var(--f-display);font-weight:400;font-size:1.5em}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto auto;gap:14px;align-items:center;background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:12px 18px;font-size:clamp(1.1rem,2.4vw,1.6rem);font-weight:700;font-variant-numeric:tabular-nums}
.rank li.first{border-color:var(--accent);background:var(--goal-bg)}
.rank .medal{font-family:var(--f-display);font-weight:400;font-size:1.3em}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card h2.qtitle{font-size:clamp(1.3rem,2.6vw,2.1rem);text-wrap:wrap}
.tablet .board,.tablet #qview,.tablet #reset,.tablet #rec{display:none}
.tablet .sub{display:none}
.recrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;font-weight:700}
.recrow select,.recrow input{font:inherit;font-weight:700;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:5.2em}
.recrow span{font-size:.9rem;color:var(--muted)}
.qa{display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,32%,340px);gap:22px;align-items:start}
.qcol{display:grid;gap:16px;align-content:start}
.pic{margin:0;border-radius:18px;overflow:hidden;background:#FFF4D6;border:3px solid var(--line);color:#3A2A00}
.pic svg,.pic img{display:block;width:100%;height:auto}
.pic .ph{aspect-ratio:200/140;display:grid;place-content:center;text-align:center;font-family:var(--f-display);font-size:4.5rem;line-height:1;color:#B9810A}
.pic .ph small{font-family:var(--f-body);font-size:.95rem;font-weight:700;color:#7A5A12;line-height:1.4;margin-top:6px}
.pic figcaption{font-family:var(--f-display);text-align:center;padding:6px 8px;font-size:1.35rem;background:#FFE9A8;color:#3A2A00}
.pic.show{border-color:var(--accent);animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@media (max-width:760px){.qa{grid-template-columns:minmax(0,1fr)}.pic{width:min(100%,320px);justify-self:center}.rank li{grid-template-columns:3em minmax(0,1fr) auto}.rank li .tm{grid-column:2 / -1}}
@media (max-width:900px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .mazewrap{width:100%}
  .side{grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .side .ghost{grid-column:1 / -1}
  .stats{margin-left:0}
}
@media (max-width:520px){
  .side{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .bean,.gate,.pic.show,.count.pop span,.wb.boing{animation:none}
  .player{transition:none}
}
</style>

<main class="app">
  <header class="top">
    <h1>콩 미로 탐험</h1>
    <div class="stats" aria-live="polite">
      <div class="pill team" id="pTeam">준비</div>
      <div class="pill timer" id="tTime">00:00.0</div>
      <div class="pill">문 <b id="sGates">0</b> / <b id="sTotal">4</b></div>
      <div class="pill">한 번에 정답 <b id="sOK">0</b></div>
    </div>
    <p class="sub">모둠 대표가 차례로 나와 문 4개를 열고 식탁까지 가요. 처음에 맞힌 문제가 많을수록, 시간이 짧을수록 높은 순위예요.</p>
  </header>

  <section class="stage">
    <div class="mazewrap" id="wrap">
      <div class="maze" id="maze" aria-label="미로"></div>
      <svg class="trail" id="trail" viewBox="0 0 17 13" preserveAspectRatio="none" aria-hidden="true"><polyline id="trailLine" points=""/></svg>
      <div class="player" id="player"><div class="bean"></div></div>
      <div class="toast" id="toast" role="status"></div>
      <div class="count" id="count" hidden><span></span></div>
    </div>

    <aside class="side">
      <div class="board">
        <h3>모둠 기록</h3>
        <ol id="rows"></ol>
      </div>
      <div class="pad">
      <p class="padcap">콩 친구 움직이기</p>
      <div class="dpad" role="group" aria-label="움직이기">
        <button class="up" data-d="0,-1" aria-label="위">▲</button>
        <button class="lf" data-d="-1,0" aria-label="왼쪽">◀</button>
        <button class="dn" data-d="0,1" aria-label="아래">▼</button>
        <button class="rt" data-d="1,0" aria-label="오른쪽">▶</button>
      </div>
      </div>
      <button class="ghost" id="rec">기록 직접 입력</button>
      <button class="ghost" id="qview">전체 문제 보기</button>
      <button class="ghost" id="snd" aria-pressed="true">🔊 소리 켜짐</button>
      <button class="ghost" id="reset">처음부터 다시</button>
    </aside>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true"></div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const CW = 8, CH = 6, W = CW * 2 + 1, H = CH * 2 + 1;
  const GOAL = [W - 2, H - 2];
  const TARGET = 45;          // 미로 정답 길이(칸 수)
  const QS = new URLSearchParams(location.search);
  const TABLET = QS.has('tablet') || QS.has('team');            // 모둠별 태블릿 모드 (동시에 진행)
  const FIXED = Math.min(5, Math.max(0, parseInt(QS.get('team'), 10) || 0));   // ?team=3 이면 3모둠으로 고정
  if (TABLET) document.body.classList.add('tablet');
  let TEAMS = 4; const PER = 4, MAXT = 5;   // 모둠 수(2, 4 또는 5), 모둠마다 문 개수
  try { const sv = localStorage.getItem('beanTeams'); if (sv === '5' || sv === '2') TEAMS = +sv; } catch (e) {}
  if (TABLET) TEAMS = 5;
  const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

  const POOL = {
    sprout:{lv:1, q:'콩에서 싹이 터서 자란 채소는 무엇일까요?', o:['시금치', '콩나물', '당근'], a:1, art:'sprout', cap:'콩나물',
      e:'콩나물은 콩에 물을 주어 싹을 틔운 채소예요.'},
    kong:{lv:2, q:'콩국수의 국물은 무엇으로 만들까요?', o:['삶은 콩을 곱게 간 국물', '우유를 끓인 국물', '멸치를 우린 국물'], a:0, art:'kong', photo:'kong', cap:'콩국수',
      e:'콩국수는 삶은 콩을 곱게 갈아서 고소한 국물을 만들어요.'},
    soymilk:{lv:1, q:'콩을 갈아서 만든 고소한 음료는 무엇일까요?', o:['두유', '식혜', '레몬차'], a:0, art:'soymilk', photo:'soymilk', cap:'두유',
      e:'두유는 콩을 불려 갈아서 만든 음료예요.'},

  const mazeEl = $('#maze'), playerEl = $('#player'), modal = $('#modal'), card = $('#card'), toastEl = $('#toast'), countEl = $('#count');

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  let allNames = ['1모둠','2모둠','3모둠','4모둠','5모둠'];
  let names = allNames.slice(0, TEAMS);
  let round = 0, sets = [], results = [];
  let cur = 0, phase = 'intro', g, gates, quiz, px, py, opened, okFirst, busy = false, modalOpen = false;
  let t0 = 0, tick = null, toastT, armT, armed = false;

  function rng(seed){ let s = (seed * 2654435761) >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
  function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const fmt = ms => { const t = Math.floor(ms / 100); return String(Math.floor(t / 600)).padStart(2,'0') + ':' + String(Math.floor(t / 10) % 60).padStart(2,'0') + '.' + (t % 10); };

  function genMaze(r){
    const m = Array.from({length:H}, () => Array(W).fill(1));
    const seen = Array.from({length:CH}, () => Array(CW).fill(false));
    const st = [[0,0]]; seen[0][0] = true; m[1][1] = 0;
    while (st.length){
      const [cx, cy] = st[st.length - 1];
      const nb = DIRS.map(([dx,dy]) => [cx+dx, cy+dy, dx, dy]).filter(([x,y]) => x>=0 && y>=0 && x<CW && y<CH && !seen[y][x]);
      if (!nb.length){ st.pop(); continue; }
      const [nx, ny, dx, dy] = nb[Math.floor(r() * nb.length)];
      seen[ny][nx] = true; m[ny*2+1][nx*2+1] = 0; m[cy*2+1+dy][cx*2+1+dx] = 0; st.push([nx, ny]);
    }
    return m;
  }
  function solve(m){
    const prev = new Map(), q = [[1,1]]; prev.set('1,1', null);
    while (q.length){
      const [x, y] = q.shift();
      if (x === GOAL[0] && y === GOAL[1]) break;
      for (const [dx, dy] of DIRS){
        const nx = x+dx, ny = y+dy, k = nx+','+ny;
        if (m[ny]?.[nx] === 0 && !prev.has(k)){ prev.set(k, [x, y]); q.push([nx, ny]); }
      }
    }
    const path = []; let c = GOAL;
    while (c){ path.unshift(c); c = prev.get(c[0]+','+c[1]); }
    return path;
  }

  /* 새 판: 길이가 같은 서로 다른 미로 4개 + 서로 다른 문제 4묶음 */
  function newSession(){
    round++;
    const order = round === 1 ? DEFAULT_SETS : shuffle(DEFAULT_SETS);
    const used = new Set(); sets = [];
    for (let t = 0; t < TEAMS; t++){
      let s = round * 211 + t * 53, m, path;
      do { s++; m = genMaze(rng(s)); path = solve(m); } while (path.length !== TARGET || used.has(s));
      used.add(s);
      const ids = round === 1 ? order[t] : shuffle(order[t]);
      sets.push({g: m, path, quiz: ids.map(k => POOL[k])});
    }
    results = names.map(() => null);
    cur = 0; phase = 'intro';
    stopTimer(); stopBgm(); $('#tTime').textContent = '00:00.0';
    showMaze(0, true);
    if (TABLET) tabletStart(); else showIntro();
    renderBoard(); header();
  }

  function showMaze(i, preview){
    const S = sets[i];
    g = S.g; quiz = S.quiz;
    gates = new Map();
    quiz.forEach((_, k) => gates.set(S.path[Math.floor(S.path.length * (k + 1) / (quiz.length + 1))].join(','), {i:k, open:false, wrong:false}));
    px = 1; py = 1; opened = 0; okFirst = 0; busy = false; modalOpen = false;
    document.documentElement.style.setProperty('--W', W);
    document.documentElement.style.setProperty('--H', H);
    let html = '';
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) html += tileHTML(x, y);
    mazeEl.innerHTML = html;
    resetTrail();
    place(); header();
  }
  function tileHTML(x, y){
    if (g[y][x] === 1) return '<div class="t w"></div>';
    const gt = gates.get(x+','+y);
    if (gt) return gt.open ? '<div class="t p door"></div>' : '<div class="t p gate"><b>?</b></div>';
    if (x === GOAL[0] && y === GOAL[1]) return '<div class="t p goal">🍽️</div>';
    return '<div class="t p"></div>';
  }
  function paintTile(x, y){
    const t = document.createElement('template');
    t.innerHTML = tileHTML(x, y);
    mazeEl.children[y * W + x].replaceWith(t.content.firstElementChild);
  }
  /* 지나간 길 선: 앞으로 가면 이어서 그리고, 왔던 길로 되돌아가면 지워요 (10/17 추가) */
  const trailEl = document.querySelector('#trail'), trailLine = document.querySelector('#trailLine');
  let trail = [];
  function drawTrail(){
    trailLine.setAttribute('points', trail.map(([x, y]) => (x + .5) + ',' + (y + .5)).join(' '));
  }
  function resetTrail(){
    trailEl.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    trail = [[px, py]]; drawTrail();
  }
  function trailStep(){
    const prev = trail[trail.length - 2];
    if (prev && prev[0] === px && prev[1] === py) trail.pop(); else trail.push([px, py]);
    drawTrail();
  }
  function place(){
    playerEl.style.left = (px / W * 100) + '%';
    playerEl.style.top = (py / H * 100) + '%';
  }
  function header(){
    $('#pTeam').textContent = phase === 'intro' ? '준비' : phase === 'final' ? '결과' : names[cur];
    $('#sGates').textContent = opened;
    $('#sTotal').textContent = quiz ? quiz.length : PER;
    $('#sOK').textContent = okFirst;
  }
  function renderBoard(){
    $('#rows').innerHTML = names.map((n, i) => {
      const r = results[i];
      const st = r ? r.ok + '/' + PER + ' · ' + fmt(r.ms) : (i === cur && (phase === 'play' || phase === 'countdown' || phase === 'ready') ? '도전 중' : '대기');
      return '<li class="' + (i === cur && phase !== 'intro' && phase !== 'final' ? 'now' : '') + '"><span class="nm">' + esc(n) + '</span><small>' + st + '</small></li>';
    }).join('');
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function showToast(msg, ms = 2000){
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), ms);
  }
  function showCard(html){ card.innerHTML = html; modal.hidden = false; modalOpen = true; }
  function closeModal(){ modal.hidden = true; modalOpen = false; }

  /* 화면: 시작 → 준비 → 카운트다운 → 도전 → 기록 → 결과 (모둠은 마음대로 골라서 도전해요) */
  const readNames = () => { names = names.map((n, i) => ((($('#n' + i) || {}).value) || '').trim() || (i + 1) + '모둠'); };
  function pickerHTML(label, skip){
    return '<p class="sec">' + label + '</p><div class="pick">' +
      names.map((n, i) => i === skip ? '' : '<button class="chip' + (results[i] ? ' done' : '') + '" data-t="' + i + '">' + esc(n) + (results[i] ? ' ✓' : '') + '</button>').join('') + '</div>';
  }
  function bindPicker(pre){

  function showIntro(){

      '<p class="tag">모둠 대결</p><h2>모둠 대표가 차례로 도전해요</h2>' +
      '<ul class="learn"><li>모둠마다 다른 미로와 다른 문제가 나와요. 미로 길이는 모두 똑같아요.</li>' +
      '<li>문 ' + PER + '개를 열고 식탁까지 가면 끝!</li>' +

      '<div class="names">' + names.map((n, i) => '<label for="n' + i + '">' + (i + 1) + '번 모둠 이름<input id="n' + i + '" maxlength="8" value="' + esc(n) + '"></label>').join('') + '</div>' +
      pickerHTML('도전할 모둠을 눌러요. 순서는 마음대로 골라도 돼요.', -1));
    card.querySelectorAll('.names input').forEach((inp, i) => inp.addEventListener('input', () => {

  }
  /* 전체 문제 보기 */
  function showList(){
    const keys = Object.keys(POOL);
    const back = phase === 'intro' ? 'intro' : (phase === 'play' ? 'close' : 'pick');
    showCard('<p class="tag">전체 문제 ' + keys.length + '개</p><p class="big">문제와 정답을 확인해요</p>' +

  /* 태블릿: 우리 모둠을 고르거나(?tablet), 주소에 모둠 번호가 있으면(?team=3) 바로 시작 */
  function tabletStart(){
    if (FIXED && FIXED <= MAXT){ loadTeam(FIXED - 1); return; }
    showCard('<p class="tag">모둠 대결</p><p class="big">우리 모둠을 눌러요</p>' +
      '<div class="pick">' + allNames.map((n, i) => '<button class="chip" data-t="' + i + '">' + esc(n) + '</button>').join('') + '</div>' +
      '<p class="sec">다른 모둠을 누르면 안 돼요. 우리 모둠이 맞는지 꼭 확인해요.</p>');
    card.querySelectorAll('.pick .chip').forEach(b => b.addEventListener('click', () => loadTeam(+b.dataset.t)));
  }
  /* 선생님이 모둠 기록을 직접 입력 */
  function showRecord(){
    const rows = names.map((n, i) => {
      const r = results[i], t = r ? Math.floor(r.ms / 100) / 10 : '';
      return '<div class="recrow"><label>' + esc(n) + '</label>' +
        '<span>맞힌 수 <select data-k="ok' + i + '">' + [0,1,2,3,4].map(v => '<option' + (r && r.ok === v ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></span>' +
        '<span>분 <input type="number" min="0" max="59" data-k="m' + i + '" value="' + (r ? Math.floor(t / 60) : '') + '"></span>' +
        '<span>초 <input type="number" min="0" max="59.9" step="0.1" data-k="s' + i + '" value="' + (r ? (t % 60).toFixed(1) : '') + '"></span></div>';
    }).join('');
    showCard('<p class="tag">기록 직접 입력</p><p class="big">태블릿 기록을 입력해요</p>' +
      '<p class="sec">기록이 있는 모둠만 채워요. 분·초를 비워 두면 기록 없음이에요.</p>' + rows +
      '<div class="row"><button class="go" id="recok">순위 보기</button><button class="ghost" id="reccx">닫기</button></div>');
    $('#reccx').addEventListener('click', () => (phase === 'intro' ? showIntro() : pickCard()));
    $('#recok').addEventListener('click', () => {
      const v = k => card.querySelector('[data-k="' + k + '"]').value;
      names.forEach((n, i) => {
        if (v('m' + i) === '' && v('s' + i) === '') return;
        const ms = Math.round(((+v('m' + i) || 0) * 60 + (+v('s' + i) || 0)) * 1000);
        results[i] = {ok: +v('ok' + i), ms};
      });
      showFinal();
    });
  }
  function pickCard(){
    showCard('<p class="tag">모둠 대결</p><p class="big">도전할 모둠을 골라요</p>' + pickerHTML('이름을 누르면 그 모둠 차례가 돼요. ✓ 는 이미 끝난 모둠이에요.', -1));
    bindPicker();
  }
  function loadTeam(i){
    stopBgm();
    cur = i; phase = 'ready';
    showMaze(i); renderBoard();
    $('#tTime').textContent = '00:00.0';
    showCard(
      '<p class="tag">모둠 대결</p>' +
      '<p class="big">' + esc(names[i]) + ' 대표, 나오세요!</p>' +
      (results[i] ? '<p class="fb bad">이미 기록이 있어요. 다시 하면 새 기록으로 바뀌어요.</p>' : '') +
      '<p class="fb">준비가 되면 시작을 누르세요. 3, 2, 1 뒤에 시간이 흐르기 시작해요.</p>' +
      '<p class="how"><b>움직이는 방법</b> 오른쪽의 ▲◀▼▶ 버튼을 누르거나, 키보드 방향키를 누르거나, 미로 칸을 눌러요. 노란 ? 문 앞에 가면 문제가 나와요.</p>' +
      '<div class="row"><button class="go" id="start">시작!</button></div>' +
      (TABLET ? (FIXED ? '' : '<div class="row"><button class="ghost" id="chg">모둠 다시 고르기</button></div>') : pickerHTML('다른 모둠으로 바꾸기', i)));
    $('#start').focus();
    $('#start').addEventListener('click', countdown);
    if (TABLET){ const c = $('#chg'); if (c) c.addEventListener('click', tabletStart); } else bindPicker();
  }
  /* 소리: 외부 파일 없이 브라우저에서 직접 만들어요 (8비트 느낌) */
  let AC = null, master = null, muted = false, bgmT = null, bgmNext = 0, bgmStep = 0;
  function audio(){
    if (!AC){
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = muted ? 0 : 1; master.connect(AC.destination); } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(freq, when, dur, type, vol){
    if (!AC) return;
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.value = freq;
    gn.gain.setValueAtTime(0.0001, when);
    gn.gain.exponentialRampToValueAtTime(vol, when + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(gn); gn.connect(master); o.start(when); o.stop(when + dur + 0.02);
  }
  function beep(final){
    if (!audio()) return;
    const t = AC.currentTime;
    if (final){ tone(1318, t, 0.45, 'square', 0.22); tone(1760, t + 0.12, 0.4, 'square', 0.16); }
    else tone(880, t, 0.22, 'square', 0.2);
  }
  /* 배경음악: 직접 만든 8비트 반복 곡 (멜로디 + 베이스) */
  const MEL = [69,72,76,72, 74,77,74,72, 71,74,77,74, 76,0,72,0,
               69,72,76,81, 79,76,74,72, 71,74,71,67, 69,0,0,0];
  const BASS = [45,41,43,45];
  function bgmSchedule(){
    if (!AC) return;
    const STEP = 0.19;
    while (bgmNext < AC.currentTime + 0.4){
      const i = bgmStep % MEL.length, m = MEL[i];
      if (m) tone(mtof(m), bgmNext, STEP * 0.85, 'square', 0.055);
      if (i % 2 === 0){ const root = BASS[Math.floor(i / 8) % 4]; tone(mtof(i % 4 === 0 ? root : root + 12), bgmNext, STEP * 1.6, 'triangle', 0.12); }
      bgmNext += STEP; bgmStep++;
    }
  }
  function startBgm(){
    if (bgmT || !audio()) return;
    bgmStep = 0; bgmNext = AC.currentTime + 0.05; bgmSchedule();
    bgmT = setInterval(bgmSchedule, 100);
  }
  function stopBgm(){ clearInterval(bgmT); bgmT = null; }
  $('#snd').addEventListener('click', () => {
    muted = !muted; audio();
    if (master) master.gain.value = muted ? 0 : 1;
    const b = $('#snd'); b.textContent = muted ? '🔇 소리 꺼짐' : '🔊 소리 켜짐'; b.setAttribute('aria-pressed', String(!muted));
  });

  async function countdown(){
    closeModal(); phase = 'countdown'; renderBoard();
    audio(); stopBgm();
    countEl.hidden = false;
    for (const n of ['3','2','1','출발!']){
      countEl.firstElementChild.textContent = n;
      countEl.classList.remove('pop'); void countEl.offsetWidth; countEl.classList.add('pop');
      beep(n === '출발!');
      await sleep(n === '출발!' ? 500 : 800);
    }
    countEl.hidden = true;
    phase = 'play'; t0 = performance.now(); startBgm();
    tick = setInterval(() => { $('#tTime').textContent = fmt(performance.now() - t0); }, 100);
  }
  function stopTimer(){ clearInterval(tick); tick = null; }

  function finishTeam(){
    stopTimer(); stopBgm();
    if (AC){ const t = AC.currentTime; [784, 988, 1175, 1568].forEach((f, k) => tone(f, t + k * 0.11, 0.25, 'square', 0.18)); }
    const ms = performance.now() - t0;
    $('#tTime').textContent = fmt(ms);
    results[cur] = {ok: okFirst, ms};
    phase = 'done'; renderBoard();
    if (TABLET){
      showCard('<p class="tag">' + esc(names[cur]) + ' 기록</p><p class="big">도착! 수고했어요</p>' +
        '<div class="res"><span>시간 <b>' + fmt(ms) + '</b></span><span>한 번에 맞힌 문제 <b>' + okFirst + '</b> / ' + PER + '</span></div>' +
        '<p class="how"><b>선생님께 알려 주세요</b> ' + esc(names[cur]) + ' · ' + okFirst + '/' + PER + ' · ' + fmt(ms) + '</p>');
      return;
    }
    const left = results.filter(r => !r).length;
    showCard(
      '<p class="tag">' + esc(names[cur]) + ' 기록</p><p class="big">도착! 수고했어요</p>' +
      '<div class="res"><span>시간 <b>' + fmt(ms) + '</b></span><span>한 번에 맞힌 문제 <b>' + okFirst + '</b> / ' + PER + '</span></div>' +
      (left ? pickerHTML('다음에 도전할 모둠을 골라요', cur) : '') +
      '<div class="row">' + (left ? '<button class="ghost" id="next">지금까지 결과 보기</button>' : '<button class="go" id="next">결과 보기</button>') +
      '<button class="ghost" id="redo">이 모둠 다시 하기</button></div>');
    $('#next').addEventListener('click', showFinal);
    $('#redo').addEventListener('click', () => { results[cur] = null; loadTeam(cur); });
    bindPicker();
  }

  function showFinal(){
    phase = 'final'; renderBoard(); header();
    const list = results.map((r, i) => r ? {n: names[i], ...r} : null).filter(Boolean).sort((a, b) => b.ok - a.ok || a.ms - b.ms);
    let rank = 0;
    list.forEach((r, i) => { if (!i || r.ok !== list[i-1].ok || Math.floor(r.ms / 100) !== Math.floor(list[i-1].ms / 100)) rank = i + 1; r.rank = rank; });
    const winners = list.filter(r => r.rank === 1).map(r => r.n);
    const left = results.filter(r => !r).length;
    showCard(
      '<p class="tag">모둠 대결 결과' + (left ? ' (아직 ' + left + '개 모둠이 남았어요)' : '') + '</p><p class="big">' + (left ? '지금 1등은 ' : '우승은 ') + winners.map(esc).join(', ') + '!</p>' +
      '<ol class="rank">' + list.map(r =>
        '<li class="' + (r.rank === 1 ? 'first' : '') + '"><span class="medal">' + r.rank + '위</span><span class="nm">' + esc(r.n) + '</span><span>맞힌 ' + r.ok + '/' + PER + '</span><span class="tm">' + fmt(r.ms) + '</span></li>').join('') + '</ol>' +
      '<ul class="learn"><li>콩은 몸을 튼튼하게 해 줘요.</li><li>콩은 배를 편안하게 해 줘요.</li><li>콩으로 만든 음식이 아주 많아요.</li></ul>' +
      '<div class="row">' + (left ? '<button class="go" id="more">남은 모둠 도전하기</button>' : '') +
      '<button class="' + (left ? 'ghost' : 'go') + '" id="again">새 문제로 다시 하기</button></div>');
    if (left) $('#more').addEventListener('click', pickCard);
    $('#again').addEventListener('click', newSession);
  }

  /* 움직이기 */
  function bump(){
    const b = playerEl.firstElementChild;
    b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  }
  async function run(dx, dy){
    if (busy || modalOpen || phase !== 'play') return;
    busy = true;
    let moved = false;
    while (phase === 'play'){
      const nx = px + dx, ny = py + dy;
      if (g[ny]?.[nx] !== 0){ if (!moved) bump(); break; }
      const gt = gates.get(nx+','+ny);
      if (gt && !gt.open){ openQuiz(gt); break; }
      px = nx; py = ny; moved = true; place(); trailStep();
      await sleep(reduce ? 20 : 90);
      if (px === GOAL[0] && py === GOAL[1]){ finishTeam(); break; }
      const opts = DIRS.filter(([a, b]) => !(a === -dx && b === -dy) && g[py+b]?.[px+a] === 0);
      if (opts.length === 1) [dx, dy] = opts[0]; else break;
    }
    busy = false;
  }

  function openQuiz(gt){
    const d = quiz[gt.i];
    const opts = shuffle(d.o.map((t, j) => ({t, ok: j === d.a})));
    showCard(
      '<p class="tag">' + esc(names[cur]) + ' · 문 ' + (gt.i + 1) + ' / ' + quiz.length + '</p>' +
      '<h2 class="qtitle">' + d.q + '</h2>' +
      '<div class="qa"><div class="qcol">' +
      '<p class="wb" id="wb" role="alert" hidden>틀렸어요! 다시 정답을 눌러보세요.</p>' +
      '<div class="opts">' + opts.map((o, j) => '<button class="opt" data-j="' + j + '">' + o.t + '</button>').join('') + '</div>' +
      '<p class="fb" id="fb" aria-live="polite"></p>' +
      '<div class="row" id="act"></div></div>' +
      '<figure class="pic" id="pic">' + (d.pre ? '<img src="' + PHOTO[d.photo] + '" alt="콩 사진">' : '<div class="ph">?<small>정답을 맞히면<br>그림이 나와요</small></div>') + '</figure></div>');
    card.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
      const o = opts[+btn.dataset.j], fb = $('#fb');
      if (o.ok){
        btn.classList.add('good');
        card.querySelectorAll('.opt').forEach(b => b.disabled = true);
        $('#wb').hidden = true;
        fb.className = 'fb good'; fb.textContent = '정답! ' + d.e;
        const pic = $('#pic');
        pic.innerHTML = (d.photo ? '<img src="' + PHOTO[d.photo] + '" alt="' + d.cap + '">' : ART[d.art]) + '<figcaption>' + d.cap + '</figcaption>';
        pic.classList.add('show');
        $('#act').innerHTML = '<button class="go" id="openGate">문 열기</button>';
        $('#openGate').addEventListener('click', () => unlock(gt));
        $('#openGate').focus();
      } else {
        gt.wrong = true;
        btn.classList.add('bad'); btn.disabled = true;
        fb.className = 'fb'; fb.textContent = '';
        const wb = $('#wb');
        wb.hidden = false; wb.classList.remove('boing'); void wb.offsetWidth; wb.classList.add('boing');
      }
    }));
  }
  function unlock(gt){
    gt.open = true; opened++; if (!gt.wrong) okFirst++;
    const [gx, gy] = [...gates.entries()].find(([, v]) => v === gt)[0].split(',').map(Number);
    paintTile(gx, gy);
    closeModal(); header();
    showToast(opened < quiz.length ? '문이 열렸어요! 계속 가요' : '모든 문이 열렸어요! 식탁으로!', 1500);
  }

  /* 조작 */
  document.querySelectorAll('.dpad button').forEach(b => b.addEventListener('click', () => {
    const [dx, dy] = b.dataset.d.split(',').map(Number); run(dx, dy);
  }));
  const KEYS = {ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
  addEventListener('keydown', e => {
    const d = KEYS[e.key]; if (!d || modalOpen || phase !== 'play') return;
    e.preventDefault(); run(d[0], d[1]);
  });
  mazeEl.addEventListener('click', e => {
    if (phase !== 'play') return;
    const r = mazeEl.getBoundingClientRect();
    const tx = Math.floor((e.clientX - r.left) / r.width * W), ty = Math.floor((e.clientY - r.top) / r.height * H);
    const dx = tx - px, dy = ty - py;
    if (!dx && !dy) return;
    const cand = (Math.abs(dx) >= Math.abs(dy) ? [[Math.sign(dx), 0], [0, Math.sign(dy)]] : [[0, Math.sign(dy)], [Math.sign(dx), 0]]).filter(([a, b]) => a || b);
    const pick = cand.find(([a, b]) => g[py+b]?.[px+a] === 0) || cand[0];
    run(pick[0], pick[1]);
  });
  $('#reset').addEventListener('click', () => {
    const b = $('#reset');
    if (!armed){
      armed = true; b.classList.add('armed'); b.textContent = '정말 처음부터? 한 번 더 누르세요';
      armT = setTimeout(() => { armed = false; b.classList.remove('armed'); b.textContent = '처음부터 다시'; }, 3500);
      return;
    }
    clearTimeout(armT); armed = false; b.classList.remove('armed'); b.textContent = '처음부터 다시';
    newSession();
  });

  $('#rec').addEventListener('click', () => { if (phase === 'play' || phase === 'countdown') return; showRecord(); });
  $('#qview').addEventListener('click', () => { if (phase === 'play' || phase === 'countdown') return; showList(); });
  newSession();
})();
</script>

</body></html>
